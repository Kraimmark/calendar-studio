name: Calendar Studio 0.9.18 Clean Source Gate

on:
  push:
    branches:
      - release/0.9.18
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-studio-0918-clean-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build clean Calendar Studio source
    runs-on:
      - self-hosted
      - Windows
      - X64
      - build-station
      - windows-desktop
      - msvc
      - tauri
    timeout-minutes: 60
    steps:
      - name: Checkout clean release source
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 0

      - name: Preserve repository line endings
        shell: powershell
        run: |
          git config core.autocrlf false
          git reset --hard HEAD

      - name: Verify clean source provenance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            'package-lock.json' = '6c9eb041a907920874ca2ace518de3d5c06682a54effc909a1201a1ca84a0e4c'
            'src-tauri\Cargo.lock' = '16c708e3f5fa2ebbcba2e42b91b82cb6cb99396c26f71ed6799fced750e74eef'
            'src-tauri\src\lib.rs' = 'e87e914a029e0c9bde0e565c8de1393fb1383be64caf068a235036e35442397d'
            'src-tauri\src\storage.rs' = 'b82caa7b955497d270c3c761d062e0aca1d02e3269ab6dc40918eef4dc2f0ded'
          }
          foreach ($path in $expected.Keys) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing clean-source input: $path" }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$path]) { throw "Unexpected SHA-256 for $path: $actual" }
          }
          $forbidden = @('.build', '.migration', '.tmp', 'node_modules', 'dist', 'src-tauri/target')
          $trackedForbidden = @(git ls-files -- $forbidden)
          if ($trackedForbidden.Count -gt 0) {
            throw "Generated or bootstrap files are tracked: $($trackedForbidden -join ', ')"
          }
          Write-Host 'Clean source provenance verified.'

      - name: Build from clean source
        shell: powershell
        run: .\scripts\build-station-release.ps1
